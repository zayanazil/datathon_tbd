[project]
name = "kaafu"
version = "0.1.0"
description = "Kaafu Connect: door-to-door travel time from 23 islands to a hospital in Greater Malé"
requires-python = ">=3.11"
dependencies = ["pandas", "numpy", "geopandas", "shapely", "duckdb", "pyarrow", "streamlit", "pydeck", "altair"]

[project.optional-dependencies]
dev = ["pytest", "openpyxl"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
